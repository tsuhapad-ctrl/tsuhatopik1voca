const save=(key,val)=>localStorage.setItem(key,JSON.stringify(val));
let progress=load(KEYS.progress,{}),favorites=new Set(load(KEYS.favorites,[])),settings=load(KEYS.settings,{dark:false,sound:true}),streak=load(KEYS.streak,{dates:[]}),daily=load(KEYS.goal,{target:10,date:'',words:[]});

function today(){return new Date().toLocaleDateString('en-CA')}
function markActivity(id){if(!streak.dates.includes(today())){streak.dates.push(today());streak.dates=streak.dates.slice(-120);save(KEYS.streak,streak)}if(id&&!daily.words.includes(id)){if(daily.date!==today())daily={target:daily.target,date:today(),words:[]};daily.words.push(id);save(KEYS.goal,daily)}}
function stats(){let learned=0,mastered=0,difficult=0;vocabularyData.forEach(w=>{const x=p(w.id);if(x.mastery>0)learned++;if(x.mastery>=5)mastered++;if(x.wrong>0&&x.mastery<5)difficult++});return{total:vocabularyData.length,learned,mastered,difficult}}
function masteryPct(words){if(!words.length)return 0;return Math.round(words.reduce((a,w)=>a+p(w.id).mastery,0)/(words.length*5)*100)}
function esc(s=''){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function getTheme(id){return themes.find(t=>t.id===id)}

function speakKorean(text){if(!('speechSynthesis'in window)){toast('Audio belum didukung browser ini.');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='ko-KR';const voices=speechSynthesis.getVoices();u.voice=voices.find(v=>v.lang.toLowerCase().startsWith('ko'))||null;u.rate=.82;speechSynthesis.speak(u);markActivity()}
let audioContext=null;
function getAudioContext(){if(!settings.sound)return null;const AudioCtx=window.AudioContext||window.webkitAudioContext;if(!AudioCtx)return null;if(!audioContext)audioContext=new AudioCtx();if(audioContext.state==='suspended')audioContext.resume();return audioContext}
function soundTone(freq,duration=.1,delay=0,type='sine',volume=.055){const ctx=getAudioContext();if(!ctx)return;const start=ctx.currentTime+delay,osc=ctx.createOscillator(),gain=ctx.createGain();osc.type=type;osc.frequency.setValueAtTime(freq,start);gain.gain.setValueAtTime(.0001,start);gain.gain.exponentialRampToValueAtTime(volume,start+.012);gain.gain.exponentialRampToValueAtTime(.0001,start+duration);osc.connect(gain);gain.connect(ctx.destination);osc.start(start);osc.stop(start+duration+.02)}
function playSound(kind='click'){
 if(!settings.sound)return;
 const patterns={click:[[520,.045,0,'sine',.035]],flip:[[330,.055,0,'sine',.035],[470,.055,.045,'sine',.03]],correct:[[523,.09,0,'sine',.055],[659,.1,.075,'sine',.055],[784,.14,.15,'sine',.06]],wrong:[[235,.12,0,'triangle',.05],[175,.18,.1,'triangle',.045]],match:[[660,.08,0,'sine',.05],[880,.14,.07,'sine',.055]],finish:[[523,.1,0,'sine',.05],[659,.1,.09,'sine',.05],[784,.1,.18,'sine',.055],[1047,.24,.27,'sine',.06]]};
 (patterns[kind]||patterns.click).forEach(n=>soundTone(...n));
}

function toggleSound(){settings.sound=!settings.sound;save(KEYS.settings,settings);updateSoundButton();if(settings.sound)playSound('correct');toast(settings.sound?'Efek suara dinyalakan. 🔊':'Efek suara dimatikan. 🔇');if(currentView==='progress')renderProgress()}

function openSpecialList(mode){selectedTheme=null;listMode=mode;listLimit=24;renderList()}
function filteredWords(){const q=(document.getElementById('vocabSearch')?.value||'').toLowerCase().trim();let words=selectedTheme?vocabularyData.filter(w=>w.theme===selectedTheme):[...vocabularyData];if(listMode==='new')words=words.filter(w=>p(w.id).mastery===0);if(listMode==='learning')words=words.filter(w=>p(w.id).mastery>0&&p(w.id).mastery<5);if(listMode==='mastered')words=words.filter(w=>p(w.id).mastery>=5);if(listMode==='favorite')words=words.filter(w=>favorites.has(w.id));if(listMode==='difficult')words=words.filter(w=>p(w.id).wrong>0).sort((a,b)=>p(b.id).wrong-p(a.id).wrong);if(q)words=words.filter(w=>[w.korean,w.meaning,w.romanization].some(x=>x.toLowerCase().includes(q)));return words}
function renderList(){document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.getElementById('listView').classList.add('active');currentView='themes';renderNav();const t=selectedTheme?getTheme(selectedTheme):null;const title=t?`${t.icon} ${t.name}`:listMode==='favorite'?'❤️ Kosakata Favorit':listMode==='difficult'?'🔥 Kosakata Sulit':'🏆 Sudah Dikuasai';document.getElementById('listView').innerHTML=`<div class="page-title"><button class="btn secondary" onclick="navigate('themes')">← Kembali</button><h1>${title}</h1><p class="muted" id="listCount"></p></div><div class="toolbar"><input id="vocabSearch" class="search" placeholder="Cari Hangul, arti, atau romanization..." aria-label="Cari kosakata" oninput="updateListCards()"><button class="btn" onclick="startFlashFromCurrent()">🃏 Pelajari Daftar Ini</button></div><div class="chip-row">${[['all','Semua'],['new','Belum Dipelajari'],['learning','Sedang Dipelajari'],['mastered','Dikuasai'],['favorite','Favorit'],['difficult','Sulit']].map(([id,n])=>`<button class="chip ${listMode===id?'active':''}" onclick="setListMode('${id}')">${n}</button>`).join('')}</div><div id="vocabCards" class="vocab-list section"></div><button id="loadMore" class="btn secondary load-more" onclick="listLimit+=24;updateListCards()">Muat Lebih Banyak</button>`;updateListCards();window.scrollTo(0,0)}
function setListMode(m){listMode=m;listLimit=24;renderList()}
function updateListCards(){const words=filteredWords();document.getElementById('listCount').textContent=`${words.length} kosakata`;const box=document.getElementById('vocabCards');if(!words.length){box.innerHTML=`<div class="card empty"><div class="emoji">${listMode==='favorite'?'❤️':'🎉'}</div><h3>${listMode==='favorite'?'Belum ada kosakata favorit.':'Belum ada kosakata di bagian ini.'}</h3><p class="muted">${listMode==='favorite'?'Tekan ikon ♥ pada kosakata yang ingin kamu simpan.':'Lanjutkan latihan untuk memperbarui koleksimu.'}</p></div>`}else box.innerHTML=words.slice(0,listLimit).map(v=>vocabCard(v)).join('');document.getElementById('loadMore').classList.toggle('hidden',words.length<=listLimit)}
function vocabCard(w){const x=p(w.id);return`<article class="card vocab-card"><div class="vocab-main" role="button" tabindex="0" onclick="openDetail(${w.id})"><div><span class="badge">${getTheme(w.theme)?.icon||''} ${w.typeId}</span> ${x.wrong?`<span class="badge">Salah ${x.wrong}×</span>`:''}</div><div class="vocab-word">${w.korean}</div><div class="vocab-meaning">${w.meaning}</div><div class="small muted">[${w.romanization}] · Mastery ${x.mastery}/5</div><div class="vocab-example"><span class="kr">${w.exampleKr}</span><br>${w.exampleId}</div></div><div class="vocab-actions"><button onclick="event.stopPropagation();speakKorean('${w.korean}')" aria-label="Dengarkan">🔊</button><button onclick="event.stopPropagation();toggleFavorite(${w.id},this)" aria-label="Favorit">${favorites.has(w.id)?'♥️':'♡'}</button><button onclick="event.stopPropagation();quickMastery(${w.id})" aria-label="Tandai dipelajari">${x.mastery>=5?'🏆':'✓'}</button></div></article>`}
function toggleFavorite(id,btn){favorites.has(id)?favorites.delete(id):favorites.add(id);save(KEYS.favorites,[...favorites]);if(btn)btn.textContent=favorites.has(id)?'♥️':'♡';toast(favorites.has(id)?'Ditambahkan ke favorit.':'Dihapus dari favorit.');if(listMode==='favorite')updateListCards()}
function quickMastery(id){const x=p(id);setP(id,{mastery:Math.min(5,x.mastery+1),status:x.mastery+1>=5?'MASTERED':'LEARNING',lastReviewed:today()});markActivity(id);toast('Progres kata diperbarui.');updateListCards()}
function startFlashFromCurrent(){const ids=filteredWords().map(w=>w.id);if(!ids.length)return toast('Belum ada kata untuk dipelajari.');startFlash({ids,count:Math.min(30,ids.length),order:'random',mode:'mixed'})}

function openDetail(id){const w=vocabularyData.find(x=>x.id===id),x=p(id),t=getTheme(w.theme);document.getElementById('detailContent').innerHTML=`<button class="icon-btn modal-close" onclick="closeModal('detailModal')" aria-label="Tutup">✕</button><div class="detail-word">${w.korean}</div><div class="muted">[${w.romanization}]</div><h2>${w.meaning}</h2><span class="badge">${w.type} · ${w.typeId}</span><p><button class="btn secondary" onclick="speakKorean('${w.korean}')">🔊 Dengarkan</button></p><hr style="border:0;border-top:1px solid var(--border)"><h3>Contoh Kalimat</h3><p class="kr" style="font-size:1.2rem">${w.exampleKr}</p><p class="muted">${w.exampleId}</p><button class="btn secondary" onclick="speakKorean('${w.exampleKr}')">🔊 Dengarkan Kalimat</button><hr style="border:0;border-top:1px solid var(--border);margin:20px 0"><p><b>Tema</b><br>${t.icon} ${t.name}</p><p><b>Mastery</b><br><span style="font-size:1.5rem">${'⭐'.repeat(x.mastery)}${'☆'.repeat(5-x.mastery)}</span></p><div class="grid" style="grid-template-columns:1fr 1fr"><button class="btn peach" onclick="toggleFavorite(${id});openDetail(${id})">${favorites.has(id)?'♥ Hapus Favorit':'♡ Tambah Favorit'}</button><button class="btn" onclick="closeModal('detailModal');startFlash({ids:[${id}],count:1,mode:'kr-id'})">🃏 Pelajari</button></div>`;document.getElementById('detailModal').classList.add('open')}

========================= */
function themeOptions(){return`<option value="all">Semua Tema</option>${themes.map(t=>`<option value="${t.id}">${t.icon} ${t.name}</option>`).join('')}`}
function renderFlashSetup(){flashSession=null;document.getElementById('flashView').innerHTML=`<div class="page-title"><span class="eyebrow">Fitur Utama</span><h1>🃏 Flashcard</h1><p class="muted">Atur sesi sesuai kebutuhanmu. Kata sulit mendapat kesempatan review lebih sering.</p></div><article class="card setup-card section"><div class="setup-grid"><label class="field">Tema<select id="fTheme">${themeOptions()}</select></label><label class="field">Jumlah<select id="fCount"><option>5</option><option selected>10</option><option>20</option><option>30</option><option>50</option><option value="all">Semua</option></select></label><label class="field">Urutan<select id="fOrder"><option value="random">Acak</option><option value="ordered">Urut</option></select></label><label class="field">Mode<select id="fMode"><option value="kr-id">Korea → Indonesia</option><option value="id-kr">Indonesia → Korea</option><option value="mixed" selected>Campuran</option></select></label><label class="field">Jenis Kosakata<select id="fType"><option value="all">Semua</option><option value="명사">Kata Benda</option><option value="동사">Kata Kerja</option><option value="형용사">Kata Sifat</option><option value="부사">Kata Keterangan</option></select></label><label class="field">Status<select id="fStatus"><option value="all">Semua</option><option value="new">Belum Belajar</option><option value="learning">Sedang Dipelajari</option><option value="difficult">Sulit</option><option value="mastered">Dikuasai</option><option value="favorite">Favorit</option></select></label></div><button class="btn full" style="margin-top:18px" onclick="startFlashFromSetup()">Mulai Belajar</button></article><p class="muted small" style="text-align:center">Shortcut desktop: Space = balik kartu · 1 = Sulit · 2 = Ragu · 3 = Mudah</p>`}
function poolFromFilters(o){let a=o.ids?vocabularyData.filter(w=>o.ids.includes(w.id)):[...vocabularyData];if(o.theme&&o.theme!=='all')a=a.filter(w=>w.theme===o.theme);if(o.type&&o.type!=='all')a=a.filter(w=>w.type===o.type);if(o.status==='new')a=a.filter(w=>p(w.id).mastery===0);if(o.status==='learning')a=a.filter(w=>p(w.id).mastery>0&&p(w.id).mastery<5);if(o.status==='difficult')a=a.filter(w=>p(w.id).wrong>0);if(o.status==='mastered')a=a.filter(w=>p(w.id).mastery>=5);if(o.status==='favorite')a=a.filter(w=>favorites.has(w.id));if(o.order!=='ordered')a=shuffle(a);const count=o.count==='all'?a.length:+o.count;return a.slice(0,count)}
function startFlashFromSetup(){startFlash({theme:document.getElementById('fTheme').value,count:document.getElementById('fCount').value,order:document.getElementById('fOrder').value,mode:document.getElementById('fMode').value,type:document.getElementById('fType').value,status:document.getElementById('fStatus').value})}
function startFlash(o){const cards=poolFromFilters(o);if(!cards.length)return toast('Tidak ada kosakata yang cocok dengan filter.');flashSession={cards,index:0,mode:o.mode||'mixed',flipped:false,answers:[]};currentView='flash';document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.getElementById('flashView').classList.add('active');renderNav();renderFlashCard();window.scrollTo(0,0)}
function flashDirection(){if(flashSession.mode==='mixed')return Math.random()<.5?'kr-id':'id-kr';return flashSession.mode}
function renderFlashCard(){const s=flashSession,w=s.cards[s.index];if(!w)return finishFlash();s.direction=s.direction||flashDirection();const krFirst=s.direction==='kr-id';document.getElementById('flashView').innerHTML=`<div class="session-top"><button class="btn secondary" onclick="renderFlashSetup()">✕ Selesai</button><b>${s.index+1} / ${s.cards.length}</b></div><div class="progress-track"><div class="progress-fill" style="width:${(s.index)/s.cards.length*100}%"></div></div><div class="flash-scene section" id="flashScene"><article class="flashcard ${s.flipped?'flipped':''}" id="flashcard" tabindex="0" role="button" aria-label="Balik flashcard" onclick="flipCard()"><div class="flash-face"><div>${krFirst?`<div class="flash-word">${w.korean}</div><div class="muted">[${w.romanization}]</div><button class="icon-btn" style="margin-top:20px" onclick="event.stopPropagation();speakKorean('${w.korean}')">🔊 Audio</button>`:`<div class="flash-meaning">${w.meaning}</div>`}<p class="muted">Ketuk untuk melihat arti</p></div></div><div class="flash-face flash-back"><div>${krFirst?`<div class="flash-word" style="font-size:2.5rem">${w.korean}</div><div class="flash-meaning">${w.meaning}</div>`:`<div class="flash-word">${w.korean}</div><div class="muted">[${w.romanization}]</div><div class="flash-meaning" style="font-size:1.4rem">${w.meaning}</div>`}<span class="badge">${w.type} · ${w.typeId}</span><div class="flash-example">${w.exampleKr}</div><div class="muted">${w.exampleId}</div><button class="icon-btn" style="margin-top:14px" onclick="event.stopPropagation();speakKorean('${w.exampleKr}')">🔊</button></div></div></article></div><div class="rating-grid"><button class="btn danger" onclick="rateFlash('hard')">😣<br>Sulit</button><button class="btn peach" onclick="rateFlash('review')">🤔<br>Masih Ingat</button><button class="btn mint" onclick="rateFlash('easy')">😊<br>Mudah</button></div><div class="swipe-hint">Geser kiri = Sulit · Geser kanan = Mudah</div>`;bindSwipe()}
function flipCard(){playSound('flip');flashSession.flipped=!flashSession.flipped;document.getElementById('flashcard')?.classList.toggle('flipped',flashSession.flipped)}
function rateFlash(r){playSound(r==='hard'?'wrong':r==='easy'?'correct':'click');const w=flashSession.cards[flashSession.index],x=p(w.id);let m=x.mastery,wrong=x.wrong,correct=x.correct;if(r==='hard'){m=Math.max(1,m-1);wrong++}if(r==='review'){m=Math.min(4,Math.max(1,m+1));correct++}if(r==='easy'){m=Math.min(5,m+2);correct++}setP(w.id,{mastery:m,wrong,correct,status:m>=5?'MASTERED':m>=2?'REVIEW':'LEARNING',lastReviewed:today()});markActivity(w.id);flashSession.answers.push(r);flashSession.index++;flashSession.flipped=false;flashSession.direction=null;renderFlashCard()}
function finishFlash(){playSound('finish');confetti();document.getElementById('flashView').innerHTML=`<article class="card empty"><div class="emoji">🎉</div><h1 class="kr">잘했어요!</h1><h2>Sesi belajar selesai!</h2><p class="muted">Kamu telah meninjau ${flashSession.cards.length} kosakata.</p><div class="grid" style="max-width:420px;margin:auto"><button class="btn" onclick="renderFlashSetup()">🃏 Mulai Sesi Baru</button><button class="btn secondary" onclick="navigate('home')">🏠 Kembali ke Beranda</button></div></article>`}
function bindSwipe(){const el=document.getElementById('flashScene');let start=0;el.addEventListener('touchstart',e=>start=e.touches[0].clientX,{passive:true});el.addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-start;if(Math.abs(d)>70)rateFlash(d>0?'easy':'hard')},{passive:true})}

/* =========================
   PRACTICE MODES / QUIZ ENGINE
========================= */
const modes=[['meaning','🅰️','Pilih Arti','Pilih arti bahasa Indonesia.'],['korean','🇰🇷','Pilih Korea','Pilih kosakata Korea.'],['type-id','⌨️','Ketik Arti','Tulis arti kata.'],['type-kr','✍️','Ketik Hangul','Tulis jawaban Korea.'],['truefalse','⭕','Benar / Salah','Nilai pasangan kata.'],['sentence','🧩','Isi Kalimat','Lengkapi contoh kalimat.'],['listening','🔊','Listening','Dengarkan lalu pilih arti.'],['matching','🔗','Matching','Cocokkan lima pasangan.'],['memory','🧠','Memory Card','Temukan pasangan kartu.'],['speed','⏱️','60 Detik','Jawab sebanyak mungkin.']];
function renderPractice(){document.getElementById('practiceView').innerHTML=`<div class="page-title"><span class="eyebrow">Pilih Mode Latihan</span><h1>🎮 Latihan & Kuis</h1><p class="muted">Setiap soal dibuat otomatis dari database kosakata.</p></div><div class="grid mode-grid section">${modes.map(m=>`<button class="mode-card" onclick="openQuizSetup('${m[0]}')"><b>${m[1]}</b><strong>${m[2]}</strong><span>${m[3]}</span></button>`).join('')}</div>`}
function openQuizSetup(mode){currentView='practice';document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.getElementById('quizView').classList.add('active');document.getElementById('quizView').innerHTML=`<div class="page-title"><button class="btn secondary" onclick="navigate('practice')">← Kembali</button><h1>${modes.find(m=>m[0]===mode)?.[2]}</h1></div><article class="card setup-card section"><div class="setup-grid"><label class="field">Tema<select id="qTheme">${themeOptions()}</select></label><label class="field">Jumlah Soal<select id="qCount"><option>5</option><option selected>10</option><option>20</option><option>30</option></select></label><label class="field">Jenis Kosakata<select id="qType"><option value="all">Semua</option><option value="명사">Kata Benda</option><option value="동사">Kata Kerja</option><option value="형용사">Kata Sifat</option><option value="부사">Kata Keterangan</option></select></label><label class="field">Status<select id="qStatus"><option value="all">Semua</option><option value="new">Belum Belajar</option><option value="learning">Sedang Dipelajari</option><option value="difficult">Sulit</option><option value="mastered">Dikuasai</option><option value="favorite">Favorit</option></select></label></div><button class="btn full" style="margin-top:18px" onclick="startQuiz('${mode}')">Mulai Latihan</button></article>`;window.scrollTo(0,0)}
function startQuickQuiz(){startQuiz('meaning',{theme:'all',count:10,type:'all',status:'all'})}
function startQuiz(mode,opts){const o=opts||{theme:document.getElementById('qTheme').value,count:document.getElementById('qCount').value,type:document.getElementById('qType').value,status:document.getElementById('qStatus').value};let pool=poolFromFilters({...o,order:'random'});if(mode==='matching'||mode==='memory')pool=shuffle(poolFromFilters({...o,count:5,order:'random'}));if(!pool.length)return toast('Tidak ada kosakata yang cocok dengan filter.');if((mode==='matching'||mode==='memory')&&pool.length<5)return toast('Pilih filter yang memiliki minimal 5 kosakata.');quizSession={mode,questions:pool,index:0,correct:0,incorrect:0,streak:0,maxStreak:0,review:[],locked:false,startTime:Date.now(),timeLeft:60,matched:0,moves:0};document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.getElementById('quizView').classList.add('active');if(mode==='matching')renderMatching();else if(mode==='memory')renderMemory();else{renderQuizQuestion();if(mode==='speed')startSpeedTimer()}window.scrollTo(0,0)}
function distractors(w,key){return shuffle(vocabularyData.filter(x=>x.id!==w.id&&x[key]!==w[key])).slice(0,3)}
function renderQuizQuestion(){const s=quizSession,w=s.questions[s.index%s.questions.length];if(!w)return finishQuiz();s.locked=false;let body='';const optionButtons=(opts,answer)=>`<div class="answers">${shuffle(opts).map(o=>`<button class="answer-btn" data-value="${esc(o)}" onclick="answerQuiz(this.dataset.value,'${esc(answer)}',this)">${esc(o)}</button>`).join('')}</div>`;
 if(s.mode==='meaning'||s.mode==='speed'){body=`<div class="quiz-word">${w.korean}</div><div class="quiz-prompt">Apa artinya?</div>${optionButtons([w.meaning,...distractors(w,'meaning').map(x=>x.meaning)],w.meaning)}`}
 if(s.mode==='korean'){body=`<div class="quiz-prompt">Manakah bahasa Korea untuk:</div><div class="flash-meaning" style="text-align:center;margin:16px">${w.meaning}</div>${optionButtons([w.korean,...distractors(w,'korean').map(x=>x.korean)],w.korean)}`}
 if(s.mode==='type-id'||s.mode==='type-kr'){const kr=s.mode==='type-kr';body=`<div class="${kr?'flash-meaning':'quiz-word'}" style="text-align:center">${kr?w.meaning:w.korean}</div><p class="quiz-prompt">${kr?'Tuliskan dalam bahasa Korea:':'Ketik artinya:'}</p><input id="quizInput" class="quiz-input ${kr?'kr':''}" lang="${kr?'ko':'id'}" autocomplete="off" autocapitalize="off"><button class="btn full" style="margin-top:10px" onclick="submitTyped('${kr?esc(w.korean):esc(w.meaning)}')">Periksa Jawaban</button>`}
 if(s.mode==='truefalse'){const truth=Math.random()>.5,shown=truth?w.meaning:distractors(w,'meaning')[0].meaning;s.truth=truth;body=`<div class="quiz-word">${w.korean}</div><div class="flash-meaning" style="text-align:center">= ${shown}</div>${optionButtons(['⭕ Benar','❌ Salah'],truth?'⭕ Benar':'❌ Salah')}`}
 if(s.mode==='sentence'){const blank=w.exampleKr.replace(w.korean,'___');body=`<div class="flash-example" style="text-align:center;font-size:1.35rem">${blank===w.exampleKr?'___ — '+w.exampleKr:w.exampleKr.replace(w.korean,'___')}</div><p class="quiz-prompt">${w.exampleId}</p>${optionButtons([w.korean,...distractors(w,'korean').map(x=>x.korean)],w.korean)}`}
 if(s.mode==='listening'){body=`<div style="text-align:center;padding:20px"><button class="btn" onclick="speakKorean('${w.korean}')" style="font-size:1.2rem">🔊 Dengarkan</button><p class="muted">Tekan tombol lalu pilih artinya.</p></div>${optionButtons([w.meaning,...distractors(w,'meaning').map(x=>x.meaning)],w.meaning)}`}
 document.getElementById('quizView').innerHTML=`<div class="session-top"><button class="btn secondary" onclick="navigate('practice')">✕ Selesai</button><b>${s.mode==='speed'?`⏱ <span id="timer">${s.timeLeft}</span> detik · `:''}🔥 Score: ${s.correct}</b></div><div class="progress-track"><div class="progress-fill" style="width:${s.mode==='speed'?Math.min(100,(60-s.timeLeft)/60*100):s.index/s.questions.length*100}%"></div></div><article class="card quiz-card section">${body}<div id="quizFeedback"></div></article>`;setTimeout(()=>document.getElementById('quizInput')?.focus(),0)}
function normalize(s){return s.toLowerCase().trim().replace(/\s+/g,' ')}
function submitTyped(answer){const inp=document.getElementById('quizInput');if(!inp.value.trim())return toast('Tulis jawaban dahulu.');answerQuiz(inp.value,answer,inp)}
function answerQuiz(given,answer,el){const s=quizSession;if(s.locked)return;s.locked=true;const ok=normalize(given)===normalize(answer)||answer.split(' / ').some(x=>normalize(x)===normalize(given));playSound(ok?'correct':'wrong');const w=s.questions[s.index%s.questions.length],x=p(w.id);if(ok){s.correct++;s.streak++;s.maxStreak=Math.max(s.maxStreak,s.streak);setP(w.id,{mastery:Math.min(5,x.mastery+1),correct:x.correct+1,status:x.mastery+1>=5?'MASTERED':'REVIEW',lastReviewed:today()});el?.classList?.add('correct')}else{s.incorrect++;s.streak=0;s.review.push({word:w,given});setP(w.id,{mastery:Math.max(1,x.mastery-1),wrong:x.wrong+1,status:'LEARNING',lastReviewed:today()});el?.classList?.add('wrong')}markActivity(w.id);const fb=document.getElementById('quizFeedback');fb.innerHTML=`<div class="feedback"><b>${ok?'✅ Benar!':'❌ Belum tepat.'}</b><br><span class="kr">${w.korean}</span> = ${w.meaning}<br><span class="kr">${w.exampleKr}</span><br><span class="muted">${w.exampleId}</span></div>`;if(s.mode==='speed'){setTimeout(nextQuiz,450)}else{fb.innerHTML+=`<button class="btn full" style="margin-top:10px" onclick="nextQuiz()">${s.index+1>=s.questions.length?'Lihat Hasil':'Soal Berikutnya'}</button>`}}
function nextQuiz(){quizSession.index++;if(quizSession.mode==='speed'){quizSession.locked=false;quizSession.questions=shuffle(vocabularyData).slice(0,Math.max(30,vocabularyData.length));renderQuizQuestion()}else if(quizSession.index>=quizSession.questions.length)finishQuiz();else renderQuizQuestion()}
function startSpeedTimer(){clearInterval(startSpeedTimer.t);startSpeedTimer.t=setInterval(()=>{if(!quizSession||quizSession.mode!=='speed')return clearInterval(startSpeedTimer.t);quizSession.timeLeft--;const t=document.getElementById('timer');if(t)t.textContent=quizSession.timeLeft;if(quizSession.timeLeft<=0){clearInterval(startSpeedTimer.t);finishQuiz()}},1000)}

/* =========================
   MATCHING / MEMORY
========================= */
function renderMatching(){const s=quizSession,cards=shuffle(s.questions.flatMap(w=>[{id:w.id,side:'kr',text:w.korean},{id:w.id,side:'id',text:w.meaning}]));s.gameCards=cards;s.selected=null;document.getElementById('quizView').innerHTML=`<div class="session-top"><button class="btn secondary" onclick="navigate('practice')">✕ Selesai</button><b>Pasangan: <span id="matchCount">0</span> / ${s.questions.length}</b></div><article class="card quiz-card"><h2>🔗 Cocokkan Pasangan</h2><p class="muted">Pilih satu kartu Korea dan satu kartu Indonesia.</p><div class="match-grid">${cards.map((c,i)=>`<button class="match-card ${c.side==='kr'?'kr':''}" data-i="${i}" onclick="pickMatch(${i},this)">${c.text}</button>`).join('')}</div></article>`}
function pickMatch(i,el){const s=quizSession,c=s.gameCards[i];if(el.classList.contains('matched'))return;if(s.selected==null){playSound('click');s.selected=i;el.classList.add('selected');return}const prev=s.gameCards[s.selected],prevEl=document.querySelector(`[data-i="${s.selected}"]`);if(s.selected!==i&&prev.id===c.id&&prev.side!==c.side){playSound('match');el.classList.add('matched');prevEl.classList.remove('selected');prevEl.classList.add('matched');s.matched++;s.correct++;const x=p(c.id);setP(c.id,{mastery:Math.min(5,x.mastery+1),correct:x.correct+1,lastReviewed:today()});markActivity(c.id);document.getElementById('matchCount').textContent=s.matched;s.selected=null;if(s.matched===s.questions.length)setTimeout(finishQuiz,500)}else{playSound('wrong');el.classList.add('wrong');prevEl.classList.add('wrong');s.incorrect++;s.streak=0;s.selected=null;setTimeout(()=>{el.classList.remove('wrong');prevEl.classList.remove('wrong','selected')},450)}}
function formatDuration(ms){const total=Math.max(0,Math.floor(ms/1000)),minutes=Math.floor(total/60),seconds=total%60;return `${String(minutes).padStart(2,'0')}:${String(seconds).padStart(2,'0')}`}
function renderMemory(){const s=quizSession;s.gameCards=shuffle(s.questions.flatMap(w=>[{id:w.id,text:w.korean,side:'kr'},{id:w.id,text:w.meaning,side:'id'}]));s.open=[];s.found=new Set();s.gameStart=Date.now();clearInterval(startMemoryTimer.t);document.getElementById('quizView').innerHTML=`<div class="session-top"><button class="btn secondary" onclick="navigate('practice')">✕ Selesai</button><b>⏱ <span id="memoryTime">00:00</span> · Langkah: <span id="moves">0</span> · Pasangan: <span id="found">0</span>/5</b></div><article class="card quiz-card"><h2>🧠 Memory Card</h2><p class="muted">Temukan 5 pasang kartu secepat mungkin.</p><div class="memory-grid">${s.gameCards.map((c,i)=>`<button class="memory-card covered ${c.side==='kr'?'kr':''}" data-m="${i}" onclick="flipMemory(${i},this)">${c.text}</button>`).join('')}</div></article>`;startMemoryTimer()}
function startMemoryTimer(){clearInterval(startMemoryTimer.t);startMemoryTimer.t=setInterval(()=>{if(!quizSession||quizSession.mode!=='memory')return clearInterval(startMemoryTimer.t);const timer=document.getElementById('memoryTime');if(timer)timer.textContent=formatDuration(Date.now()-quizSession.gameStart)},250)}
function flipMemory(i,el){const s=quizSession;if(s.open.includes(i)||s.found.has(s.gameCards[i].id)||s.open.length>=2)return;playSound('flip');el.classList.remove('covered');s.open.push(i);if(s.open.length===2){s.moves++;document.getElementById('moves').textContent=s.moves;const[a,b]=s.open,ca=s.gameCards[a],cb=s.gameCards[b];if(ca.id===cb.id&&ca.side!==cb.side){playSound('match');s.found.add(ca.id);s.open=[];document.getElementById('found').textContent=s.found.size;const x=p(ca.id);setP(ca.id,{mastery:Math.min(5,x.mastery+1),correct:x.correct+1,lastReviewed:today()});markActivity(ca.id);if(s.found.size===5){s.elapsedTime=Date.now()-s.gameStart;clearInterval(startMemoryTimer.t);setTimeout(finishQuiz,600)}}else{playSound('wrong');setTimeout(()=>{document.querySelector(`[data-m="${a}"]`)?.classList.add('covered');document.querySelector(`[data-m="${b}"]`)?.classList.add('covered');s.open=[]},700)}}}

/* =========================
   RESULTS
========================= */
function finishQuiz(){clearInterval(startSpeedTimer.t);clearInterval(startMemoryTimer.t);playSound('finish');const s=quizSession;if(s.mode==='memory'){const elapsed=s.elapsedTime||Date.now()-s.gameStart;confetti();document.getElementById('quizView').innerHTML=`<article class="card quiz-card"><div class="empty"><div class="emoji">🎉</div><h1 class="kr">잘했어요!</h1><h2>Semua Pasangan Ditemukan!</h2><p class="muted">Skor Memory Card dihitung berdasarkan kecepatan dan jumlah langkah.</p><div class="result-score">⏱ ${formatDuration(elapsed)}</div><h2>${s.moves} Langkah</h2><p>🧠 Pasangan ditemukan: 5 / 5</p></div><div class="grid" style="margin-top:18px"><button class="btn" onclick="openQuizSetup('memory')">🧠 Main Lagi</button><button class="btn secondary" onclick="navigate('home')">🏠 Kembali ke Beranda</button></div></article>`;return}const total=s.mode==='matching'?s.correct+s.incorrect:s.mode==='speed'?s.correct+s.incorrect:s.questions.length,pct=total?Math.round(s.correct/total*100):0;confetti();document.getElementById('quizView').innerHTML=`<article class="card quiz-card"><div class="empty"><div class="emoji">🎉</div><h1 class="kr">잘했어요!</h1><h2>Latihan Selesai!</h2><div class="result-score">${s.correct} / ${total}</div><h2>${pct}% · ${pct>=90?'⭐ Excellent!':pct>=70?'Bagus sekali!':'Terus berlatih!'}</h2><p>✅ Benar: ${s.correct} &nbsp; ❌ Salah: ${s.incorrect} &nbsp; 🔥 Streak: ${s.maxStreak}</p></div>${s.review.length?`<h3>Perlu Dipelajari Lagi</h3>${s.review.slice(0,12).map(r=>`<div class="review-item"><b class="kr">${r.word.korean}</b> — ${r.word.meaning}<br><span class="muted">Jawabanmu: ${esc(r.given)} ❌</span><br><span class="kr">${r.word.exampleKr}</span> · ${r.word.exampleId}</div>`).join('')}`:''}<div class="grid" style="margin-top:18px"><button class="btn" onclick="openQuizSetup('${s.mode}')">🎮 Main Lagi</button><button class="btn secondary" onclick="startFlash({ids:[${s.review.map(r=>r.word.id).join(',')}],count:'all',mode:'mixed'})" ${s.review.length?'':'disabled'}>🃏 Pelajari Soal Salah</button><button class="btn secondary" onclick="navigate('home')">🏠 Kembali ke Beranda</button></div></article>`}

/* =========================
   PROGRESS / STREAK / SETTINGS
========================= */
function renderProgress(){const s=stats(),pct=masteryPct(vocabularyData),unseen=s.total-s.learned,learning=s.learned-s.mastered;const days=['Min','Sen','Sel','Rab','Kam','Jum','Sab'];let week=[];for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);week.push({name:days[d.getDay()],done:streak.dates.includes(d.toLocaleDateString('en-CA'))})}document.getElementById('progressView').innerHTML=`<div class="page-title"><span class="eyebrow">Statistik Belajar</span><h1>📊 Progres Belajar</h1><p class="muted">Progres tersimpan otomatis di perangkat ini.</p></div><div class="grid progress-summary section"><div class="card stat"><div class="num">${s.total}</div><div class="label">Total Kosakata</div></div><div class="card stat"><div class="num">${s.learned}</div><div class="label">Dipelajari</div></div><div class="card stat"><div class="num">${s.mastered}</div><div class="label">Dikuasai</div></div><div class="card stat"><div class="num">${s.difficult}</div><div class="label">Perlu Diulang</div></div></div><article class="card goal-card section"><div class="goal-top"><h2>TOPIK Level 1</h2><b>${pct}%</b></div><div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div><div class="grid stats-grid" style="margin-top:20px"><div><b>🔵 ${unseen}</b><br><span class="muted small">Belum Dipelajari</span></div><div><b>🟡 ${learning}</b><br><span class="muted small">Sedang Dipelajari</span></div><div><b>🟢 ${s.mastered}</b><br><span class="muted small">Dikuasai</span></div></div></article><div class="grid daily-goal-grid section"><article class="card goal-card"><h2>Progres Berdasarkan Tema</h2>${themes.map(t=>{const ws=vocabularyData.filter(w=>w.theme===t.id),x=masteryPct(ws);return`<div class="progress-theme"><div class="goal-top"><span>${t.icon} ${t.name}</span><b>${x}%</b></div><div class="progress-track"><div class="progress-fill" style="width:${x}%"></div></div></div>`}).join('')}</article><div><article class="card goal-card"><h2>🔥 Study Streak</h2><div style="font-size:2.4rem;font-weight:850">${currentStreak()} Hari</div><div class="streak-week">${week.map(d=>`<div class="day ${d.done?'done':''}">${d.name}<br>${d.done?'✓':'·'}</div>`).join('')}</div></article><article class="card goal-card section"><h2>Pengaturan</h2><button class="btn secondary full" onclick="toggleSound()">${settings.sound?'🔊 Matikan Efek Suara':'🔇 Nyalakan Efek Suara'}</button><button class="btn secondary full" style="margin-top:10px" onclick="toggleDark()">${settings.dark?'☀️ Light Mode':'🌙 Dark Mode'}</button><button class="btn danger full" style="margin-top:10px" onclick="document.getElementById('confirmModal').classList.add('open')">Reset Progress</button><p class="muted small">Data belajar hanya disimpan di browser perangkat ini.</p></article></div></div>`}
function toggleDark(){settings.dark=!settings.dark;save(KEYS.settings,settings);document.body.classList.toggle('dark',settings.dark);document.getElementById('themeToggle').textContent=settings.dark?'☀️':'🌙';if(currentView==='progress')renderProgress()}
document.getElementById('themeToggle').onclick=toggleDark;document.getElementById('themeToggle').textContent=settings.dark?'☀️':'🌙';
document.getElementById('soundToggle').onclick=toggleSound;updateSoundButton();
document.getElementById('confirmReset').onclick=()=>{Object.values(KEYS).forEach(k=>localStorage.removeItem(k));progress={};favorites=new Set();streak={dates:[]};daily={target:10,date:'',words:[]};settings={dark:false,sound:true};document.body.classList.remove('dark');updateSoundButton();closeModal('confirmModal');navigate('home');toast('Seluruh progres telah dihapus.')};
document.querySelectorAll('.modal-wrap').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)closeModal(m.id)}));
document.addEventListener('keydown',e=>{if(document.activeElement?.matches('input,select,textarea')){if(e.key==='Enter'&&document.getElementById('quizInput'))document.querySelector('#quizInput + .btn')?.click();return}if(flashSession&&document.getElementById('flashcard')){if(e.code==='Space'){e.preventDefault();flipCard()}if(e.key==='1')rateFlash('hard');if(e.key==='2')rateFlash('review');if(e.key==='3')rateFlash('easy')}if(e.key==='Escape')document.querySelectorAll('.modal-wrap.open').forEach(m=>closeModal(m.id))});
function confetti(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;for(let i=0;i<35;i++){const c=document.createElement('i');c.className='confetti';c.style.left=Math.random()*100+'vw';c.style.background=['#F6C85F','#FFB59D','#B9DBC8','#fff'][i%4];c.style.animationDelay=Math.random()*.4+'s';document.body.appendChild(c);setTimeout(()=>c.remove(),2300)}}

/* =========================
   DATABASE VALIDATION / INIT
========================= */
const duplicateIds=vocabularyData.filter((w,i,a)=>a.findIndex(x=>x.id===w.id)!==i);const invalid=vocabularyData.filter(w=>!w.korean||!w.meaning||!w.romanization||!w.type||!w.theme||!w.exampleKr||!w.exampleId||!getTheme(w.theme));if(duplicateIds.length||invalid.length)console.error('Database validation failed',{duplicateIds,invalid});
renderNav();renderHome();
  </script>
